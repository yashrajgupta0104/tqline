<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="T&QLine - A premium academic dissertation and proposal community for Lancaster University students. Share dissertation thoughts, ask research questions, find peer support, and refine your thesis.">
  <title>T&QLine | Premium Lancaster Dissertation Community</title>
  
  <!-- Premium Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Application CSS -->
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- Main application shell -->
  <div id="app">
    <!-- Initial Loading State -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #0c0c0e; color: #ffffff; font-family: 'Outfit', sans-serif; gap: 1.5rem;">
      <div style="position: relative; width: 60px; height: 60px; border: 3px solid rgba(224, 30, 38, 0.1); border-top-color: #E01E26; border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <div style="font-size: 1.5rem; font-weight: 700; background: linear-gradient(to right, #ffffff, #a1a1aa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 0.25rem;">
        T&Q<span style="color: #E01E26;">Line</span>
      </div>
      <div style="font-size: 0.85rem; color: #71717a; text-transform: uppercase; letter-spacing: 1.5px;">Loading Student Sandbox...</div>
      
      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>
    </div>
  </div>

  <!-- Application Entry script -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
